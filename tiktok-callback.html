<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization — Cappy</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 600px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.6;
    color: #1a1a1a;
  }
  h1 { font-size: 1.4em; }
  .box {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
    background: #f9f9f9;
  }
  .label { font-size: 0.85em; color: #666; margin-bottom: 4px; }
  .value {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
    font-size: 0.95em;
  }
  button {
    margin-top: 8px;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
  }
  button:hover { background: #eee; }
  .error { color: #c0392b; }
  .empty { color: #999; font-style: italic; }
</style>
</head>
<body>

<h1>TikTok Authorization Callback</h1>
<p>This page just receives TikTok's redirect after you approve access. Copy the code below and paste it wherever <code>authorize.py</code> is asking for it.</p>

<div id="content"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const errorDescription = params.get('error_description');
  const content = document.getElementById('content');

  function box(label, value, copyable) {
    const div = document.createElement('div');
    div.className = 'box';
    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = label;
    const valueEl = document.createElement('div');
    valueEl.className = 'value';
    valueEl.textContent = value;
    div.appendChild(labelEl);
    div.appendChild(valueEl);
    if (copyable) {
      const btn = document.createElement('button');
      btn.textContent = 'Copy';
      btn.onclick = () => {
        navigator.clipboard.writeText(value);
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      };
      div.appendChild(btn);
    }
    return div;
  }

  if (error) {
    const div = document.createElement('div');
    div.className = 'box error';
    div.innerHTML = '<strong>Authorization was not granted</strong><br>' +
      error + (errorDescription ? ': ' + errorDescription : '');
    content.appendChild(div);
  } else if (code) {
    content.appendChild(box('Authorization Code', code, true));
    if (state) {
      content.appendChild(box('State', state, false));
    }
  } else {
    const div = document.createElement('div');
    div.className = 'box empty';
    div.textContent = 'No authorization code found in the URL. If you navigated here directly rather than via TikTok\'s redirect, that\'s expected — this page only shows something useful right after the OAuth flow sends you here.';
    content.appendChild(div);
  }
</script>

</body>
</html>
